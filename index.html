<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0f14">
<title>DOTA2 进阶挑战</title>
<style>
:root{
  --bg:#0c0f14;--card:#141922;--card2:#181e29;--line:rgba(255,255,255,.08);
  --red:#d3452f;--red-d:#a12b1e;--gold:#d8b26a;--gold-d:#c8a05f;
  --txt:#e8e6e1;--sub:#9aa3b2;
  --sans:'PingFang SC','Microsoft YaHei','Helvetica Neue',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:var(--sans);color:var(--txt);min-height:100vh;
  background:
    radial-gradient(70% 45% at 50% 108%, rgba(190,45,30,.22) 0%, transparent 70%),
    radial-gradient(120% 55% at 50% -8%, #1b2231 0%, transparent 62%),
    var(--bg);
}
#app{max-width:520px;margin:0 auto;padding:0 18px;min-height:100vh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:36px 0}
.hidden{display:none !important}

/* ---------- 开始页 ---------- */
.crest{width:64px;height:64px;margin:0 auto 22px;border:2px solid rgba(216,178,106,.55);border-radius:50%;
  display:flex;align-items:center;justify-content:center;position:relative}
.crest::before,.crest::after{content:"";position:absolute;top:-9px;left:50%;width:2px;height:14px;background:rgba(216,178,106,.55)}
.crest::before{transform:translateX(-14px) rotate(24deg)}
.crest::after{transform:translateX(12px) rotate(-24deg)}
.crest i{width:22px;height:22px;background:linear-gradient(160deg,#e05a3d,#a12b1e);transform:rotate(45deg);border-radius:3px;display:block}
h1.title{font-size:34px;text-align:center;letter-spacing:.08em;font-weight:800;
  background:linear-gradient(180deg,#f3d9a4,#d8b26a 55%,#a87f3e);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub-en{text-align:center;color:var(--sub);font-size:12px;letter-spacing:.42em;margin-top:8px;text-transform:uppercase}
.slogan{margin:30px auto 0;text-align:center;font-size:19px;line-height:1.7;color:#f0ede6;font-weight:600;
  padding:14px 20px;border:1px solid rgba(216,178,106,.35);border-radius:14px;background:rgba(216,178,106,.07);max-width:400px}
.rules{list-style:none;margin:26px auto 0;max-width:400px;display:flex;flex-direction:column;gap:9px}
.rules li{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:14px;line-height:1.6}
.rules li::before{content:"";width:6px;height:6px;background:var(--gold-d);transform:rotate(45deg);flex:0 0 auto}
.btn-main{display:block;margin:36px auto 0;width:min(320px,100%);padding:16px 0;border:none;border-radius:999px;cursor:pointer;
  font-size:18px;font-weight:700;letter-spacing:.22em;color:#fff;text-indent:.22em;
  background:linear-gradient(180deg,#e05a3d,#a12b1e);box-shadow:0 10px 26px -8px rgba(190,45,30,.55)}
.btn-main:active{filter:brightness(1.08)}
.btn-main:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn-ghost{display:block;margin:14px auto 0;width:min(320px,100%);padding:14px 0;border-radius:999px;cursor:pointer;
  font-size:15px;letter-spacing:.14em;text-indent:.14em;color:var(--gold);background:transparent;border:1.5px solid rgba(216,178,106,.5)}

/* ---------- 答题页 ---------- */
.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#q-num{font-size:15px;color:var(--gold);letter-spacing:.12em;font-weight:700}
.pts{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.bar{height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:22px}
#bar-fill{display:block;height:100%;width:0;background:linear-gradient(90deg,#e05a3d,#d8b26a);transition:width .3s ease;border-radius:99px}
.qcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:14px;padding:18px 16px;margin-bottom:16px}
#q-text{font-size:17px;font-weight:700;line-height:1.7}
#opts{display:flex;flex-direction:column;gap:11px;margin-bottom:26px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 14px;cursor:pointer;
  background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:13px;font-size:15px;line-height:1.6;font-family:var(--sans)}
.opt .badge{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(216,178,106,.55);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--red);background:rgba(211,69,47,.13)}
.opt.sel .badge{background:linear-gradient(180deg,#e05a3d,#a12b1e);border-color:transparent;color:#fff}

/* ---------- 结果页 ---------- */
#r-title{text-align:center;font-size:26px;font-weight:800;letter-spacing:.1em}
#r-title.ok{color:#7fc97f}
#r-title.bad{color:#e05a3d}
.score{text-align:center;margin:14px 0 6px}
.score #r-score{font-size:72px;font-weight:800;color:#f3d9a4;
  background:linear-gradient(180deg,#f3d9a4,#d8b26a 60%,#a87f3e);-webkit-background-clip:text;background-clip:text;color:transparent}
.score .unit{font-size:20px;color:var(--sub);margin-left:6px}
#r-msg{text-align:center;color:var(--sub);font-size:15px;line-height:1.7;margin-bottom:6px}
#reward{margin:22px auto 0;text-align:center;max-width:360px}
#reward img{width:100%;border-radius:14px;border:1px solid rgba(216,178,106,.4);display:block;box-shadow:0 18px 44px -18px rgba(0,0,0,.85)}
#reward .cap{margin-top:10px;font-size:13px;color:var(--gold-d);letter-spacing:.08em}
.divider{height:1px;background:var(--line);margin:22px 0 0}
</style>
</head>
<body>
<div id="app">

  <section id="screen-start" class="screen">
    <div class="crest"><i></i></div>
    <h1 class="title">DOTA2 进阶挑战</h1>
    <p class="sub-en">ADVANCED QUIZ</p>
    <p class="slogan">先来检验一下你上网的成果</p>
    <ul class="rules">
      <li>共 10 道单选题，一页一题，每题 10 分</li>
      <li>题目顺序随机打乱，每次进入都不一样</li>
      <li>80 分及以上，解锁提示图片</li>
      <li>不足 80 分，需要重新挑战</li>
    </ul>
    <button class="btn-main" id="btn-start" type="button">开始挑战</button>
  </section>

  <section id="screen-quiz" class="screen hidden">
    <div class="quiz-head">
      <span id="q-num">第 1 / 10 题</span>
      <span class="pts">每题 10 分</span>
    </div>
    <div class="bar"><i id="bar-fill"></i></div>
    <div class="qcard"><p id="q-text"></p></div>
    <div id="opts"></div>
    <button class="btn-main" id="btn-next" type="button" disabled>下一题</button>
  </section>

  <section id="screen-result" class="screen hidden">
    <p id="r-title"></p>
    <div class="score"><span id="r-score"></span><span class="unit">分</span></div>
    <p id="r-msg"></p>
    <div id="reward" class="hidden">
      <img id="reward-img" alt="提示图片">
      <p class="cap">提示图片已解锁 · 长按或截图保存</p>
    </div>
    <button class="btn-main" id="btn-retry" type="button">重新挑战</button>
  </section>

</div>

  {q:"肉山刷新的最小间隔是多少分钟？", opts:["8 分钟","10 分钟","5 分钟","13 分钟"], a:2},
  {q:"下列哪个英雄的 A 杖效果不是强化大招？", opts:["帕克","玛尔斯","斯温","水晶室女"], a:2},
  {q:"关于诡计之雾，下面描述准确的是？", opts:["经过防御塔立刻破雾","靠近敌方英雄/真实守卫范围会破雾，防御塔本身不会直接破雾","雾状态下可以被真实视野单位无条件看见","开启后获得最大生命值护盾"], a:1},
  {q:"关于伤害格挡机制，说法正确的是？", opts:["格挡属于护甲减伤，先算格挡再算护甲","格挡是固定数值抵消，和护甲减伤是两套独立计算","所有格挡效果对攻城单位全额生效","强袭装甲自带高额伤害格挡"], a:1},
  {q:"关于否决坠饰，说法正确的是？", opts:["可以直接驱散正在生效的 BKB 减益免疫","可以驱散莲花宝珠的法术反弹 buff","可以驱散林肯法球的抵挡 buff","能阻止技能免疫单位释放技能"], a:2},
  {q:"赏金神符的固定刷新间隔是？", opts:["2 分钟","3 分钟","4 分钟","6 分钟"], a:1},
  {q:"原生技能的控制效果，无视减益免疫（穿透 BKB）的是？", opts:["撼地者 沟壑眩晕","暗影萨满 枷锁","马格纳斯 两极反转拉扯","祸乱之源 魔爪"], a:3},
  {q:"原生圣剑被敌方英雄拾取变为自由圣剑，规则是？", opts:["拾取瞬间就可以为该英雄提供攻击力","拾取后需要等待冷却时间才能生效","拾取后立刻获得攻击力，该英雄死亡才会再次掉落","敌方拾取后永远无法生效"], a:2},

];

var POINTS = 10, PASS = 80;
var LETTERS = ["A","B","C","D"];
var order = [], idx = 0, answers = [], selected = -1;

function $(id){ return document.getElementById(id); }
function show(id){
  ["screen-start","screen-quiz","screen-result"].forEach(function(s){
    $(s).classList.toggle("hidden", s !== id);
  });
}
function shuffle(arr){
  for(var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function startQuiz(){
  order = shuffle(QUESTIONS.map(function(_, i){ return i; }));
  idx = 0;
  answers = new Array(QUESTIONS.length).fill(-1);
  show("screen-quiz");
  renderQuestion();
}
function renderQuestion(){
  var q = QUESTIONS[order[idx]];
  selected = -1;
  $("q-num").textContent = "第 " + (idx + 1) + " / " + QUESTIONS.length + " 题";
  $("bar-fill").style.width = ((idx + 1) / QUESTIONS.length * 100) + "%";
  $("q-text").textContent = q.q;
  $("btn-next").disabled = true;
  $("btn-next").textContent = (idx === QUESTIONS.length - 1) ? "查看成绩" : "下一题";
  var box = $("opts");
  box.innerHTML = "";
  q.opts.forEach(function(text, i){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.innerHTML = '<span class="badge">' + LETTERS[i] + '</span><span>' + text + '</span>';
    b.addEventListener("click", function(){
      selected = i;
      var btns = box.querySelectorAll(".opt");
      for(var k = 0; k < btns.length; k++) btns[k].classList.toggle("sel", k === i);
      $("btn-next").disabled = false;
    });
    box.appendChild(b);
  });
}
function nextStep(){
  answers[idx] = selected;
  idx++;
  if(idx < QUESTIONS.length){ renderQuestion(); } else { renderResult(); }
}
function renderResult(){
  var score = 0;
  order.forEach(function(qi, i){ if(answers[i] === QUESTIONS[qi].a) score += POINTS; });
  $("r-score").textContent = score;
  var ok = score >= PASS;
  $("r-title").textContent = ok ? "挑战成功" : "挑战失败";
  $("r-title").className = ok ? "ok" : "bad";
  $("r-msg").textContent = ok ? "找找它在哪里" : "未达到 80 分，还差 " + (PASS - score) + " 分，再试试吧";
  $("reward").classList.toggle("hidden", !ok);
  if(ok){ $("reward-img").src = HELMET_IMG; }
  $("btn-retry").textContent = ok ? "再挑战一次" : "重新答题";
  show("screen-result");
}

$("btn-start").addEventListener("click", startQuiz);
$("btn-next").addEventListener("click", nextStep);
$("btn-retry").addEventListener("click", startQuiz);
</script>
